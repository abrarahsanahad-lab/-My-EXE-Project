name: Build Update EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Compile
        run: x86_64-w64-mingw32-gcc main.c -o Update.exe -lgdi32 -lwininet

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Update-EXE
          path: Update.exe
          
